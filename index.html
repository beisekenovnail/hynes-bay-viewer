<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hynes Bay · model results</title>
<style>
:root{--bg:#eceee9;--card:rgba(255,255,255,.95);--ink:#1d2320;--mut:#69736d;--line:#d4d9d3;--acc:#1f6f5c;--hi:#e4572e}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}#map.drag{cursor:grabbing}
.card{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
#panel{top:12px;left:12px;width:290px;padding:11px 12px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}.row select{max-width:196px}
select,input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 0}
.time{display:flex;align-items:center;gap:5px}
.time button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:30px;padding:3px 7px;cursor:pointer;font:inherit;color:var(--ink)}
.time button:hover{border-color:var(--acc)}
#date{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
details{margin-top:9px;border-top:1px solid var(--line);padding-top:7px}summary{cursor:pointer;color:var(--mut)}
.set{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center;margin-top:8px}
.set input[type=number]{width:64px}.set input[type=range]{width:110px;margin:0}
#note{color:var(--mut);font-size:12px;margin-top:6px}
#legend{top:12px;right:12px;padding:10px 12px 8px}
#ltitle{font-weight:600;margin-bottom:6px;white-space:nowrap}
#tip{position:fixed;pointer-events:none;background:rgba(29,35,32,.92);color:#fff;padding:4px 7px;border-radius:5px;font-size:12px;display:none;white-space:nowrap;z-index:5}
#series{left:50%;transform:translateX(-50%);bottom:36px;width:min(760px,calc(100vw - 24px));padding:7px 10px 6px}
#series .h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);margin-bottom:3px}
#series button{border:0;background:none;font-size:17px;line-height:1;cursor:pointer;color:var(--mut)}
#chart{width:100%;height:150px;display:block;cursor:col-resize}
#slegend{font-size:11px;margin:0 0 3px}#slegend .sw{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin:0 5px 0 12px}#slegend .sw:first-child{margin-left:0}
#snote{font-size:11px;color:var(--mut);margin-top:2px}
#foot{position:fixed;left:12px;bottom:9px;color:var(--mut);font-size:11px;max-width:min(460px,50vw);background:rgba(255,255,255,.82);padding:2px 7px;border-radius:5px}
.lay{display:grid;grid-template-columns:auto 1fr;gap:5px 7px;align-items:center;margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.lay input{margin:0;accent-color:var(--acc)}.lay label{cursor:pointer}
.lay .sub{color:var(--mut);font-size:11px;margin-top:-2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px 0 7px;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}.dot:first-child{margin-left:0}
#fitst{grid-column:1/-1;justify-self:start;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font:inherit;color:var(--ink);margin-top:2px}#fitst:hover{border-color:var(--acc)}
#attr{position:fixed;right:12px;bottom:3px;color:rgba(255,255,255,.9);font-size:10px;text-shadow:0 0 3px #000}
</style>
<canvas id="map"></canvas>
<div id="panel" class="card">
  <label class="row">Model <select id="model"></select></label>
  <label class="row">Variable <select id="var"></select></label>
  <label class="row" id="layerrow" hidden>Layer <select id="layer"><option value="sal_s">surface</option><option value="sal_da">depth-averaged</option><option value="sal_b">bottom</option></select></label>
  <div class="time"><button id="prev" title="previous day (←)">‹</button><button id="play" title="play / pause (space)">▶</button><button id="next" title="next day (→)">›</button><span id="date"></span></div>
  <input type="range" id="t" min="0" value="0">
  <div class="lay">
    <input type="checkbox" id="L_sat" checked><label for="L_sat">Satellite imagery</label>
    <input type="checkbox" id="L_rel"><label for="L_rel">Lidar relief (hillshade)</label>
    <input type="checkbox" id="L_mod" checked><label for="L_mod">Model values</label>
    <input type="checkbox" id="outl" checked><label for="outl">Cell boundaries</label>
    <input type="checkbox" id="lbl" checked><label for="lbl">Cell numbers</label>
    <input type="checkbox" id="L_st" checked><label for="L_st">Data stations</label>
    <span></span><span class="sub"><i class="dot" style="background:#1f5fbf"></i>NOAA<i class="dot" style="background:#e07b00"></i>TWDB<i class="dot" style="background:#7b3fb5"></i>NCEI<i class="dot" style="background:#2a9d4b"></i>USGS</span>
    <button id="fitst" title="zoom out to see every station; double-click the map to come back">Show all stations</button>
  </div>
  <details><summary>Settings</summary>
    <div class="set">
      <span>Colour range</span><span><input type="number" id="lo" step="any"> – <input type="number" id="hi" step="any"></span>
      <span>Auto range (this day)</span><input type="checkbox" id="auto">
      <span>Palette</span><select id="pal"></select>
      <span id="paintlbl">Paint</span><select id="paint"><option value="wet">wet area only</option><option value="cell">whole cells</option></select>
      <span>Opacity</span><input type="range" id="op" min="0.2" max="1" step="0.05" value="0.9">
      <span>Playback speed</span><select id="speed"><option value="250">slow</option><option value="90" selected>normal</option><option value="30">fast</option></select>
    </div>
  </details>
  <div id="note" hidden></div>
</div>
<div id="legend" class="card"><div id="ltitle"></div><canvas id="lbar"></canvas></div>
<div id="tip"></div>
<div id="series" class="card" hidden><div class="h"><span id="stitle"></span><button id="sclose" title="close">×</button></div><div id="slegend"></div><canvas id="chart" title="click or drag to change the date"></canvas><div id="snote" hidden></div></div>
<div id="foot"></div>
<div id="attr" hidden>Imagery © Esri, Maxar, Earthstar Geographics</div>
<script src="data/base_data.js"></script>
<script>
const $=id=>document.getElementById(id),dpr=Math.max(1,window.devicePixelRatio||1);
const b64=(s,T)=>{const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new T(u.buffer)};
const BA=window.BASE,G=BA.dem,B=BA.bounds,CELLS=BA.cells,LINKS=BA.links,RW=G.w,RH=G.h,Z=b64(G.z,Uint16Array),CID=b64(G.cell,Uint8Array),DS=BA.datasets;
const hs=new Image();hs.src="data:image/png;base64,"+G.hs;
const STN=BA.stations||[],ORGC={NOAA:"#1f5fbf",TWDB:"#e07b00",NCEI:"#7b3fb5",USGS:"#2a9d4b"};
// ---------------- satellite basemap: Esri World Imagery tiles (imagery only, no labels) ----------------
const TILES=new Map();let tileRAF=0;
const lon2x=(lon,z)=>(lon+180)/360*2**z,lat2y=(lat,z)=>{const r=lat*Math.PI/180;return(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z};
const x2lon=(x,z)=>x/2**z*360-180,y2lat=(y,z)=>{const n=Math.PI-2*Math.PI*y/2**z;return 180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)))};
function tile(z,x,y){const k=z+"/"+x+"/"+y;let t=TILES.get(k);if(!t){t=new Image();t.crossOrigin="anonymous";
 t.onload=()=>{if(!tileRAF)tileRAF=setTimeout(()=>{tileRAF=0;draw()},60)};t.src=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;TILES.set(k,t)}return t}
function satellite(W,H){const a=inv(0,0),b=inv(W,H),mpp=110574/(fit.s*view.k)/dpr,lat=(a[1]+b[1])/2;
 let z=Math.max(3,Math.min(18,Math.round(Math.log2(40075016.7*Math.cos(lat*Math.PI/180)/(256*mpp)))));
 const range=z=>[Math.floor(lon2x(a[0],z)),Math.floor(lon2x(b[0],z)),Math.floor(lat2y(a[1],z)),Math.floor(lat2y(b[1],z))];
 let r=range(z);while((r[1]-r[0]+1)*(r[3]-r[2]+1)>150&&z>3)r=range(--z);
 for(const zz of [Math.max(3,z-3),z]){const q=range(zz);   // coarse level first, so the map is never blank while detail loads
  for(let x=q[0];x<=q[1];x++)for(let y=q[2];y<=q[3];y++){const t=tile(zz,x,y);if(!t.complete||!t.naturalWidth)continue;
   const p=P(x2lon(x,zz),y2lat(y,zz)),s=P(x2lon(x+1,zz),y2lat(y+1,zz));ctx.drawImage(t,p[0],p[1],s[0]-p[0]+.6,s[1]-p[1]+.6)}}}
const PALS={ocean:[[0,"#14213d"],[.2,"#1f4e79"],[.4,"#2a7f8f"],[.6,"#5fb49c"],[.8,"#c9d99a"],[1,"#f4e3a1"]],
 viridis:[[0,"#440154"],[.25,"#3b528b"],[.5,"#21918c"],[.75,"#5ec962"],[1,"#fde725"]],
 thermal:[[0,"#1b0c41"],[.25,"#65156e"],[.5,"#b63458"],[.75,"#ec6f3a"],[1,"#fbe06f"]],
 blues:[[0,"#eef5fb"],[.35,"#9cc3e3"],[.7,"#3f7fbf"],[1,"#15306b"]],greys:[[0,"#f4f4f2"],[1,"#262a28"]]};
const VARS={icm:{salinity:{name:"Salinity",unit:"ppt",key:"salinity",lo:0,hi:35,pal:"ocean",dec:1},
  temperature:{name:"Water temperature",unit:"°C",key:"temperature",lo:5,hi:35,pal:"thermal",dec:1},
  stage:{name:"Water level",unit:"m NAVD88",key:"stage",lo:0,hi:1.2,pal:"blues",dec:2},
  depth:{name:"Inundation depth",unit:"m",key:"depth",lo:0,hi:1,pal:"blues",dec:2},
  flow:{name:"Flows between cells",unit:"m³/s"}},
 schism:{salinity:{name:"Salinity",unit:"psu",lo:0,hi:35,pal:"ocean",dec:1},
  temperature:{name:"Water temperature",unit:"°C",q:"temp_s",lo:5,hi:35,pal:"thermal",dec:1},
  depth:{name:"Water depth",unit:"m",q:"depth",lo:0,hi:1.2,pal:"blues",dec:2},
  currents:{name:"Currents, depth-averaged",unit:"m/s"}}};
const LAYER={sal_s:"surface",sal_da:"depth-averaged",sal_b:"bottom"};
let ds=DS[0],I=null,SC=null,cur="salinity",layer="sal_s",sel=null,timer=null,ti=0,view={k:1,x:0,y:0},fit={s:1,x:0,y:0};
const kind=()=>ds.kind,V=()=>VARS[kind()][cur],ready=()=>kind()=="icm"?!!I:!!SC,dates=()=>kind()=="icm"?I.dates:SC.W.dates,arrowVar=()=>cur=="flow"||cur=="currents";
const ST={};function st(){const k=ds.id+":"+cur;if(!ST[k]){const v=V();ST[k]={lo:v.lo,hi:v.hi,pal:v.pal||"ocean",auto:false}}return ST[k]}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function palRGB(p,f){const P=PALS[p];f=f<0?0:f>1?1:f;for(let i=1;i<P.length;i++)if(f<=P[i][0]){const a=hex(P[i-1][1]),b=hex(P[i][1]),k=(f-P[i-1][0])/(P[i][0]-P[i-1][0]);return a.map((x,j)=>Math.round(x+(b[j]-x)*k))}return hex(P[P.length-1][1])}
const LUTS={};function lut(p){if(!LUTS[p]){const a=new Uint8Array(768);for(let i=0;i<256;i++)a.set(palRGB(p,i/255),i*3);LUTS[p]=a}return LUTS[p]}
const cosl=Math.cos((B.lat0+B.lat1)/2*Math.PI/180);
function P(lon,lat){const bx=(lon-B.lon0)*cosl,by=B.lat1-lat;return[(fit.x+bx*fit.s)*view.k+view.x,(fit.y+by*fit.s)*view.k+view.y]}
function inv(x,y){const bx=((x-view.x)/view.k-fit.x)/fit.s,by=((y-view.y)/view.k-fit.y)/fit.s;return[B.lon0+bx/cosl,B.lat1-by]}
const cv=$("map"),ctx=cv.getContext("2d");
function resize(){const W=innerWidth,H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;const bw=(B.lon1-B.lon0)*cosl,bh=B.lat1-B.lat0,pad=36;
 fit.s=Math.min((W-2*pad)/bw,(H-2*pad)/bh);fit.x=(W-bw*fit.s)/2;fit.y=(H-bh*fit.s)/2;draw()}
// ---------------- datasets (lazy loading) ----------------
function decodeSchism(W){const g=W.grid;SC={W,g,idx:b64(g.idx,Int32Array),bed:b64(g.bed,Int16Array),q:{},cu:b64(W.cur.u,Int8Array),cvv:b64(W.cur.v,Int8Array)};
 SC.n=SC.idx.length;for(const k in W.q)SC.q[k]={lo:W.q[k].lo,hi:W.q[k].hi,a:b64(W.q[k].data,Uint8Array)};
 SC.rev=new Int32Array(g.w*g.h).fill(-1);SC.idx.forEach((p,k)=>SC.rev[p]=k);SC.off=document.createElement("canvas");SC.off.width=g.w;SC.off.height=g.h;SC.ctx=SC.off.getContext("2d");SC.img=SC.ctx.createImageData(g.w,g.h)}
const cache={};
function loadDS(d,done,fail){const use=()=>{if(d.kind=="icm")I=window[d.glob];else{if(!cache[d.id]){decodeSchism(window[d.glob]);cache[d.id]=SC}SC=cache[d.id]}done()};
 if(window[d.glob])return use();const n=$("note");n.hidden=false;n.textContent="Loading "+d.label+"…";const s=document.createElement("script");s.src=d.file;
 s.onload=()=>{n.hidden=true;use()};s.onerror=()=>{n.textContent="Not available yet: "+d.file;fail&&fail()};document.head.appendChild(s)}
const qkey=()=>cur=="salinity"?layer:VARS.schism[cur].q;
function sval(key,k,t){const q=SC.q[key],c=q.a[t*SC.n+k];return c===255?null:q.lo+(q.hi-q.lo)*c/254}
// ---------------- painting ----------------
const off=document.createElement("canvas");off.width=RW;off.height=RH;const octx=off.getContext("2d"),img=octx.createImageData(RW,RH);
function autoRange(){let a=[];if(kind()=="icm"){const k=cur=="depth"?"depth":V().key;a=I.vars[k][ti].filter(v=>v!=null)}else{const key=qkey();for(let k=0;k<SC.n;k+=3){const v=sval(key,k,ti);if(v!=null)a.push(v)}}
 if(!a.length)return;a.sort((x,y)=>x-y);const q=f=>a[Math.min(a.length-1,Math.max(0,Math.round(f*(a.length-1))))];let lo=q(.02),hi=q(.98);if(hi-lo<1e-6)hi=lo+1;st().lo=+lo.toFixed(2);st().hi=+hi.toFixed(2)}
function paintICM(){const px=img.data,s=st(),stg=I.vars.stage[ti],wet=$("paint").value=="wet"||cur=="depth",vals=(cur=="depth"||cur=="flow")?null:I.vars[V().key][ti],L=lut(s.pal),span=(s.hi-s.lo)||1;
 for(let p=0,o=0;p<RW*RH;p++,o+=4){const c=CID[p];if(c===255||Z[p]===0){px[o+3]=0;continue}const d=stg[c]-(Z[p]/1000-1);
  if(cur=="flow"){if(d>0.02){px[o]=156;px[o+1]=196;px[o+2]=214;px[o+3]=150}else px[o+3]=0;continue}
  if(wet&&d<=0.02){px[o+3]=0;continue}const v=cur=="depth"?d:vals[c];if(v==null){px[o+3]=0;continue}
  let i=Math.round((v-s.lo)/span*255);i=i<0?0:i>255?255:i;px[o]=L[i*3];px[o+1]=L[i*3+1];px[o+2]=L[i*3+2];px[o+3]=255}octx.putImageData(img,0,0)}
function paintSchism(){const px=SC.img.data;px.fill(0);const n=SC.n,o=ti*n;
 if(cur=="currents"){const d=SC.q.depth.a;for(let k=0;k<n;k++){const c=d[o+k];if(c===255||c===0)continue;const p=SC.idx[k]*4;px[p]=156;px[p+1]=196;px[p+2]=214;px[p+3]=150}}
 else{const s=st(),L=lut(s.pal),span=(s.hi-s.lo)||1,q=SC.q[qkey()],a=q.a,qs=(q.hi-q.lo)/254;
  for(let k=0;k<n;k++){const c=a[o+k];if(c===255)continue;let i=Math.round((q.lo+qs*c-s.lo)/span*255);i=i<0?0:i>255?255:i;const p=SC.idx[k]*4;px[p]=L[i*3];px[p+1]=L[i*3+1];px[p+2]=L[i*3+2];px[p+3]=255}}
 SC.ctx.putImageData(SC.img,0,0)}
function path(c){ctx.beginPath();for(const r of c.rings){r.forEach((p,k)=>{const q=P(p[0],p[1]);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.closePath()}}
function draw(){const W=innerWidth,H=innerHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 const sat=$("L_sat").checked,a=P(G.lon0,G.lat1),b=P(G.lon1,G.lat0),op=+$("op").value;ctx.imageSmoothingEnabled=true;$("attr").hidden=!sat;
 if(sat){ctx.fillStyle="#29322d";ctx.fillRect(0,0,W,H);satellite(W,H)}
 if($("L_rel").checked&&hs.complete){ctx.globalAlpha=sat?.5:.85;ctx.drawImage(hs,a[0],a[1],b[0]-a[0],b[1]-a[1]);ctx.globalAlpha=1}
 if(!ready()){stations();scalebar(W,H);return}
 if(!arrowVar()&&st().auto)autoRange();
 if($("L_mod").checked){
  if(kind()=="icm"){const cellPaint=$("paint").value=="cell"&&cur!="depth"&&cur!="flow";
   if(!cellPaint){paintICM();ctx.globalAlpha=cur=="flow"?1:op;ctx.drawImage(off,a[0],a[1],b[0]-a[0],b[1]-a[1])}ctx.globalAlpha=1;
   if(cellPaint){const v=I.vars[V().key][ti],s=st();CELLS.forEach((c,i)=>{if(v[i]==null)return;ctx.fillStyle=`rgba(${palRGB(s.pal,(v[i]-s.lo)/((s.hi-s.lo)||1))},${op})`;path(c);ctx.fill()})}}
  else{paintSchism();const g=SC.g,c0=P(g.lon0,g.lat1),c1=P(g.lon1,g.lat0);ctx.globalAlpha=cur=="currents"?1:op;ctx.drawImage(SC.off,c0[0],c0[1],c1[0]-c0[0],c1[1]-c0[1]);ctx.globalAlpha=1}}
 if($("outl").checked){ctx.lineJoin="round";ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=2.6;CELLS.forEach(c=>{path(c);ctx.stroke()});
  ctx.strokeStyle="rgba(16,22,19,.9)";ctx.lineWidth=1.1;CELLS.forEach(c=>{path(c);ctx.stroke()})}
 if(kind()=="icm"&&sel!=null){ctx.strokeStyle="#e4572e";ctx.lineWidth=2.6;path(CELLS[sel]);ctx.stroke()}
 if(kind()=="schism"&&sel!=null){const q=P(sel.lon,sel.lat);ctx.strokeStyle="#e4572e";ctx.lineWidth=2;ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.stroke()}
 if($("L_mod").checked){if(cur=="flow")flowArrows();if(cur=="currents")currentArrows()}
 if($("lbl").checked){ctx.font="600 11px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=3;ctx.fillStyle="#141a17";
  CELLS.forEach(c=>{const q=P(c.cx,c.cy);ctx.strokeText(c.id,q[0],q[1]);ctx.fillText(c.id,q[0],q[1])})}
 stations();scalebar(W,H);legend();syncSettings();$("date").textContent=dates()[ti];$("t").value=ti;if(sel!=null)chart()}
// ---------------- arrows ----------------
const mag=v=>Math.log10(Math.abs(v)/5e-4+1),curLen=s=>6+34*Math.sqrt(Math.min(s,1));
function arrow(g,x,y,ang,len,lw,col){g.save();g.translate(x,y);g.rotate(ang);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=lw;
 g.beginPath();g.moveTo(-len/2,0);g.lineTo(len/2-4,0);g.stroke();g.beginPath();g.moveTo(len/2+4,0);g.lineTo(len/2-5,-4);g.lineTo(len/2-5,4);g.closePath();g.fill();g.restore()}
function flowArrows(){const q=I.flow[ti],L=LINKS;for(let i=0;i<q.length;i++){const v=q[i];if(v==null||Math.abs(v)<5e-4)continue;const s=Math.sign(v),p=P(L.mx[i],L.my[i]),m=mag(v);
 arrow(ctx,p[0],p[1],Math.atan2(-L.dy[i]*s,L.dx[i]*s),6+9*m,1+1.2*m,L.type[i]==1?"#123b5e":"#1f8a70")}}
function currentArrows(){const C=SC.W.cur,n=C.lon.length,o=ti*n;for(let k=0;k<n;k++){const u=SC.cu[o+k],v=SC.cvv[o+k];if(u===-128||v===-128)continue;const sp=Math.hypot(u,v)/100;if(sp<0.004)continue;
 const p=P(C.lon[k],C.lat[k]);arrow(ctx,p[0],p[1],Math.atan2(-v,u),curLen(sp),1.3,"#123b5e")}}
// ---------------- decorations ----------------
function stations(){if(!$("L_st").checked)return;ctx.font="600 11px system-ui";ctx.textAlign="left";ctx.textBaseline="middle";ctx.lineJoin="round";
 for(const s of STN){const q=P(s.lon,s.lat);ctx.beginPath();ctx.arc(q[0],q[1],6,0,7);ctx.fillStyle=ORGC[s.org]||"#333";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();

  label=`Point ${sel.lat.toFixed(4)}, ${sel.lon.toFixed(4)} · `+label}
 let lo=Infinity,hi=-Infinity;for(const s of series)for(const v of s.a)if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}if(!(hi>lo)){lo=isFinite(lo)?lo:0;hi=lo+1}

 xaxis(g,D,X,h,T,Bm);
 for(const s of series){g.strokeStyle=s.col;g.lineWidth=s.lw;g.beginPath();let on=false;s.a.forEach((v,i)=>{if(v==null){on=false;return}const x=X(i),y=Y(v);on?g.lineTo(x,y):(g.moveTo(x,y),on=true)});g.stroke()}
 const xc=X(ti);g.strokeStyle="#e4572e";g.fillStyle="#e4572e";g.lineWidth=1.5;g.beginPath();g.moveTo(xc,T);g.lineTo(xc,h-Bm);g.stroke();
