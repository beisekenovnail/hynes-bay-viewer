<style>
:root{--bg:#eceee9;--card:rgba(255,255,255,.95);--ink:#1d2320;--mut:#69736d;--line:#d4d9d3;--acc:#1f6f5c;--hi:#e4572e}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:grab}#map.drag{cursor:grabbing}
.card{position:fixed;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
#panel{top:12px;left:12px;width:290px;padding:11px 12px 10px;max-height:calc(100vh - 48px);overflow-y:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}.row select{max-width:196px}.row #var{max-width:207px}
select,input[type=number]{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 0}
.time{display:flex;align-items:center;gap:5px}
.time button{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:30px;padding:3px 7px;cursor:pointer;font:inherit;color:var(--ink)}
.time button:hover{border-color:var(--acc)}
#date{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
details{margin-top:9px;border-top:1px solid var(--line);padding-top:7px}summary{cursor:pointer;color:var(--mut)}
.set{display:grid;grid-template-columns:1fr auto;gap:7px 10px;align-items:center;margin-top:8px}
.set input[type=number]{width:64px}.set input[type=range]{width:110px;margin:0}
#note{color:var(--mut);font-size:12px;margin-top:6px}
#legend{top:12px;right:12px;padding:10px 12px 8px;max-height:calc(100vh - 24px);overflow-y:auto}
#ltitle{font-weight:600;margin-bottom:6px;max-width:250px}
#lnote{font-size:11px;color:var(--mut);margin-top:2px;max-width:250px;line-height:1.35}
#lnote.off{color:#b2182b}#lbar.off{opacity:.3}
#lextra .lx{border-top:1px solid var(--line);margin-top:7px;padding-top:6px;font-size:11px;line-height:1.5}
#lextra .lx b{font-weight:600;display:block;margin-bottom:2px;font-size:12px}
#lextra svg{vertical-align:middle;margin-right:5px}
#tip{position:fixed;pointer-events:none;background:rgba(29,35,32,.92);color:#fff;padding:4px 7px;border-radius:5px;font-size:12px;line-height:1.4;display:none;white-space:pre-line;max-width:460px;z-index:5}
#series{left:50%;transform:translateX(-50%);bottom:36px;width:min(760px,calc(100vw - 24px));padding:7px 10px 6px}
#series .h{display:flex;justify-content:space-between;align-items:center;color:var(--mut);margin-bottom:3px}
#series button{border:0;background:none;font-size:17px;line-height:1;cursor:pointer;color:var(--mut)}
#chart{width:100%;height:150px;display:block;cursor:col-resize}
#slegend{font-size:11px;margin:0 0 3px}#slegend .sw{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin:0 5px 0 12px}#slegend .sw:first-child{margin-left:0}
#snote{font-size:11px;color:var(--mut);margin-top:2px}

 terrain:[[0,"#15397a"],[.2,"#2f78b7"],[.3,"#7cc3d6"],[.38,"#cfe8b8"],[.5,"#8fc46f"],[.66,"#e3d58a"],[.82,"#b98450"],[1,"#f3eee6"]],

 schism:{salinity:{name:"Salinity",unit:"psu",lo:0,hi:35,pal:"ocean",dec:1},

  depth:{name:"Water depth",unit:"m",q:"depth",lo:0,hi:1.2,pal:"blues",dec:2},

let ds=DS[0],I=null,SC=null,cur="salinity",layer="sal_s",sel=null,timer=null,ti=0,view={k:1,x:0,y:0},fit={s:1,x:0,y:0};
